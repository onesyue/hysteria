name: "Validate inherited scripts (no fork publish)"

on:
  push:
    branches:
      - master
    paths:
      - scripts/install_server.sh
      - scripts/_redirects
      - .github/workflows/scripts.yml
      - YUE_FORK.md
  pull_request:
    paths:
      - scripts/install_server.sh
      - scripts/_redirects
      - .github/workflows/scripts.yml
      - YUE_FORK.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Validate scripts; Cloudflare publish is upstream-owned
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check installer syntax and redirect contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install_server.sh
          test "$(cat scripts/_redirects)" = "/ /install_server.sh 301"
