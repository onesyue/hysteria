name: "Create release tags for nested modules"

on:
  push:
    tags:
      - app/v*.*.*

permissions: {}

jobs:
  tag:
    name: "Create tags"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Extract tagbase"
        id: extract_tagbase
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = context.ref;
            core.info(`context.ref: ${ref}`);
            const refPrefix = 'refs/tags/app/';
            if (!ref.startsWith(refPrefix)) {
              core.setFailed(`context.ref does not start with ${refPrefix}: ${ref}`);
              return;
            }
            const tagbase = ref.slice(refPrefix.length);
            core.info(`tagbase: ${tagbase}`);
            core.setOutput('tagbase', tagbase);

      - name: "Tagging core/*"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_TAGPREFIX: "core/"
          INPUT_TAGBASE: ${{ steps.extract_tagbase.outputs.tagbase }}
        with:
          script: |
            const tagbase = core.getInput('tagbase', { required: true });
            const tagprefix = core.getInput('tagprefix', { required: true });
            const refname = `tags/${tagprefix}${tagbase}`;
            core.info(`creating ref ${refname}`);
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${refname}`,
                sha: context.sha
              });
              core.info(`created ref ${refname}`);
              return;
            } catch (error) {
              core.info(`failed to create ref ${refname}: ${error}`);
            }
            // Release tags are immutable supply-chain identities. A retried
            // app release may observe the exact tag already present; accept
            // only that idempotent case and never move it to another commit.
            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: refname
              });
              if (existing.data.object.sha === context.sha) {
                core.info(`ref ${refname} already points to ${context.sha}`);
                return;
              }
              core.setFailed(
                `ref ${refname} is immutable and points to ${existing.data.object.sha}, not ${context.sha}`
              );
            } catch (error) {
              core.setFailed(`failed to verify existing ref ${refname}: ${error}`);
            }

      - name: "Tagging extras/*"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_TAGPREFIX: "extras/"
          INPUT_TAGBASE: ${{ steps.extract_tagbase.outputs.tagbase }}
        with:
          script: |
            const tagbase = core.getInput('tagbase', { required: true });
            const tagprefix = core.getInput('tagprefix', { required: true });
            const refname = `tags/${tagprefix}${tagbase}`;
            core.info(`creating ref ${refname}`);
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${refname}`,
                sha: context.sha
              });
              core.info(`created ref ${refname}`);
              return;
            } catch (error) {
              core.info(`failed to create ref ${refname}: ${error}`);
            }
            // Match core/*: an existing release tag is accepted only when it
            // already names this exact commit. Never rewrite release history.
            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: refname
              });
              if (existing.data.object.sha === context.sha) {
                core.info(`ref ${refname} already points to ${context.sha}`);
                return;
              }
              core.setFailed(
                `ref ${refname} is immutable and points to ${existing.data.object.sha}, not ${context.sha}`
              );
            } catch (error) {
              core.setFailed(`failed to verify existing ref ${refname}: ${error}`);
            }
